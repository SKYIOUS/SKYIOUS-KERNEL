# Limine boot configuration for Vahi Kernel
# Place this file in the root, limine/, boot/, or boot/limine/ directory

TIMEOUT=3

:Vahi Kernel
PROTOCOL=limine
KERNEL_PATH=boot:///boot/vahi_kernel
MODULE_PATH=boot:///boot/initrd.tar
MODULE_CMDLINE=initrd
# 128 KiB kernel stack
STACK_SIZE=131072
KASLR=yes
