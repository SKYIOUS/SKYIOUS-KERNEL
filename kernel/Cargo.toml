cargo-features = ["profile-rustflags"]

[package]
name = "vahi_kernel"
version = "0.3.0"
edition = "2021"

[dependencies]
vahi-sync = { path = "../crates/sync" }
vahi-memory = { path = "../crates/memory" }
vahi-crypto = { path = "../crates/crypto" }
vahi-hal = { path = "../crates/hal" }
vahi-limine = { path = "../crates/limine" }
vahi-ipc = { path = "../crates/ipc" }
vahi-pci = { path = "../crates/pci" }
vahi-ebpf = { path = "../crates/ebpf", optional = true }
vahi-syscalls = { path = "../crates/syscalls" }
vahi-vfs = { path = "../crates/vfs" }
vahi-apic = { path = "../crates/apic" }
vahi-drivers = { path = "../crates/drivers" }
vahi-task = { path = "../crates/task" }
vahi-objects = { path = "../crates/objects" }
vahi-types = { path = "../crates/types" }
vahi-acpi = { path = "../crates/acpi" }
vahi-net = { path = "../crates/net" }
vahi-gdt = { path = "../crates/gdt" }
vahi-arch = { path = "../crates/arch" }
vahi-boot = { path = "../crates/boot" }
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
spin = "0.9.8"
volatile = "0.2.6"
linked_list_allocator = "0.10.5"
crossbeam-queue = { version = "0.3.12", default-features = false, features = ["alloc"] }
futures-util = { version = "0.3.31", default-features = false, features = ["alloc"] }
smoltcp = { version = "0.10", default-features = false, features = ["alloc", "log", "medium-ethernet", "proto-ipv4", "proto-ipv6", "socket-icmp", "socket-udp", "socket-tcp", "socket-dhcpv4"] }
xmas-elf = "0.9.1"
font8x8 = { version = "0.3", default-features = false, features = ["unicode"] }
fatfs = { git = "https://github.com/rafalh/rust-fatfs", rev = "c4b88477b22ca7e5131fbd8891f62a5deaa88e6e", default-features = false, features = ["alloc"] }
embedded-io = "0.6.1"
mbr-nostd = "0.1.0"

# Enhanced data structures
hashbrown = { version = "0.14", default-features = false, features = ["alloc", "ahash"] }
heapless = { version = "0.8", default-features = false }
limine = "0.6.5"

# x86_64-specific dependencies
[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = "0.14.2"
pic8259 = "0.10.1"
pc-keyboard = "0.5.1"
acpi = "4.1.1"
aml = { version = "0.16.4", optional = true }

[features]
default = ["smp", "net", "ext4"]
verification = []
smp = []
net = []
uhci = []
ext4 = []
self_test = []
ash = []
gpu = []
ebpf = []
hypervisor = []

[profile.dev]
panic = "abort"
rustflags = ["-Z", "stack-protector=strong"]

[profile.test]
opt-level = 0
debug = "line-directives-only"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
rustflags = ["-Z", "stack-protector=strong"]

# Local build-std workaround (not upstream): hashbrown's optional
# `rustc-std-workspace-alloc` shim dependency conflicts with -Zbuild-std's
# injected alloc extern (E0464: multiple candidates for alloc). The vendored
# copy drops that shim; cargo then resolves `extern crate alloc` via the
# build-std extern like every other crate in this kernel.
[patch.crates-io]
hashbrown = { path = "vendor/hashbrown" }

[build-dependencies]
bootloader-boot-config = "0.11"
