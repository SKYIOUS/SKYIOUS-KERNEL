cargo-features = ["profile-rustflags"]

[workspace]
resolver = "2"
members = [
    "kernel",
    "builder",
    "crates/sync",
    "crates/memory",
    "crates/arch",
    "crates/task",
    "crates/vfs",
    "crates/net",
    "crates/drivers",
    "crates/crypto",
    "crates/hal",
    "crates/limine",
    "crates/types",
    "crates/apic",
    "crates/acpi",
    "crates/gdt",
    "crates/objects",
    "crates/ipc",
    "crates/pci",
    "crates/syscalls",
    "crates/verified",
]

# builder is std-only (Python build scripts). Build explicitly with: cargo build -p builder
default-members = [
    "kernel",
    "crates/sync",
    "crates/memory",
    "crates/arch",
    "crates/task",
    "crates/vfs",
    "crates/net",
    "crates/drivers",
    "crates/crypto",
    "crates/hal",
    "crates/limine",
    "crates/types",
    "crates/apic",
    "crates/acpi",
    "crates/gdt",
    "crates/objects",
    "crates/ipc",
    "crates/pci",
    "crates/syscalls",
    "crates/verified",
]

[workspace.package]
version = "0.3.0"
edition = "2021"

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"
lto = false
codegen-units = 1
panic = "abort"
rustflags = ["-Z", "stack-protector=strong"]

