cargo-features = ["profile-rustflags"]

[workspace]
resolver = "2"
members = [
    "kernel",
    "builder",
    "crates/sync",
    "crates/memory",
    "crates/arch",
    "crates/task",
    "crates/vfs",
    "crates/net",
    "crates/drivers",
    "crates/crypto",
    "crates/hal",
    "crates/limine",
    "crates/types",
    "crates/apic",
    "crates/acpi",
    "crates/objects",
    "crates/ipc",
    "crates/pci",
    "crates/syscalls",
    "crates/verified",
]

# builder is std-only (Python build scripts). Build explicitly with: cargo build -p builder
default-members = [
    "kernel",
    "crates/sync",
    "crates/memory",
    "crates/arch",
    "crates/task",
    "crates/vfs",
    "crates/net",
    "crates/drivers",
    "crates/crypto",
    "crates/hal",
    "crates/limine",
    "crates/types",
    "crates/apic",
    "crates/acpi",
    "crates/objects",
    "crates/ipc",
    "crates/pci",
    "crates/syscalls",
    "crates/verified",
]

[workspace.package]
version = "0.3.0"
edition = "2021"

[workspace.dependencies]
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher"] }

[profile.dev]
panic = "abort"

# Arithmetic-safety profile. `release` leaves overflow-checks and
# debug-assertions off, so any wrapping computation on untrusted input (ACPI
# table lengths, disk-supplied counts, ELF DT_STRSZ) executes silently. This
# profile turns both on so the QEMU self-test suite surfaces that class of bug
# mechanically instead of by inspection.
#
#   cargo build --profile audit --target x86_64-unknown-none \
#       --features self_test -Zbuild-std=core,alloc
#
# PR CI builds release; nightly CI runs the `audit_small` self-test suite.
# The other variants remain on-demand gates.
[profile.audit]
inherits = "dev"
overflow-checks = true
debug-assertions = true
# One-shot gates: incremental state only adds disk churn, and reusing it
# across profile changes has produced stale-artifact failures here. Variants
# inherit this.
incremental = false

# Isolation variants: same as `audit` with one knob off, so a boot failure can
# be attributed to a specific check rather than to "checked arithmetic" in
# general.
[profile.audit_ovf]
inherits = "audit"
debug-assertions = false

[profile.audit_dbg]
inherits = "audit"
overflow-checks = false

# Same checks as `audit` but optimised for size, so the binary is the same order
# of magnitude as release. Isolates "checked arithmetic" from "unoptimised
# binary too large for the KASLR mapping to relocate".
[profile.audit_small]
inherits = "audit"
opt-level = "z"

[profile.release]
opt-level = "z"
lto = false
codegen-units = 16
panic = "abort"
rustflags = ["-Z", "stack-protector=strong"]

[patch.crates-io]
bootloader = { path = "builder/vendor/bootloader" }
