name: Nightly

# Extended gates that are too slow for every PR. Same honesty rule as ci.yml:
# no swallowed failures, no `|| true`. A red nightly is a finding, not noise.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  full-builds:
    name: Full Release Builds
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: kernel
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-toolchain
        id: install-toolchain
        with:
          target: x86_64-unknown-none
          components: rust-src,llvm-tools-preview,clippy,rustfmt
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-nightly-builds-${{ hashFiles('Cargo.lock', 'kernel/Cargo.lock') }}-all
      - name: Build release (default features)
        run: cargo build --release --target x86_64-unknown-none --locked
      - name: Build release (self_test)
        run: cargo build --release --target x86_64-unknown-none --locked --features "self_test,smp,net,ext4,iommu"
      - name: Build release (all features)
        run: cargo build --release --target x86_64-unknown-none --locked --no-default-features --features "smp,net,ext4,iommu,uhci,ash,hypervisor,verification,gpu"

  cross-arch:
    name: Cross-Arch Builds
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: kernel
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-toolchain
        id: install-toolchain
        with:
          target: x86_64-unknown-none
          components: rust-src,llvm-tools-preview,clippy,rustfmt
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-cross-arch-${{ hashFiles('Cargo.lock', 'kernel/Cargo.lock') }}-smp
      - name: Build aarch64
        run: |
          rustup target add aarch64-unknown-none --toolchain ${{ steps.install-toolchain.outputs.channel }}
          cargo build --target aarch64-unknown-none --features smp --locked
      # No riscv64 linker script exists, so this is check-only. It exists to
      # surface portability breaks that compile cleanly on x86_64 (ADR-028:
      # the syscall-init seam bug was masked only because riscv64 was never
      # built in CI).
      - name: Check riscv64
        run: |
          rustup target add riscv64gc-unknown-none-elf --toolchain ${{ steps.install-toolchain.outputs.channel }}
          cargo check --target riscv64gc-unknown-none-elf --locked

  build-kernel-nightly:
    name: Build Kernel & Boot Images (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-toolchain
        id: install-toolchain
        with:
          target: x86_64-unknown-none
          components: rust-src,llvm-tools-preview,clippy,rustfmt
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-build-kernel-nightly-${{ hashFiles('Cargo.lock', 'kernel/Cargo.lock') }}
      - name: Cache Limine binaries
        uses: actions/cache@v4
        with:
          path: /tmp/limine-binary
          key: limine-${{ hashFiles('builder/build_limine_image.py') }}
      # Build release + self_test kernel (for selftest suites)
      - name: Build kernel (release, self_test)
        working-directory: kernel
        run: cargo build --release --target x86_64-unknown-none --locked --features "self_test,smp,net,ext4,iommu"
      # Build audit_small + self_test kernel (for audit profile suite)
      - name: Build kernel (audit_small, self_test)
        working-directory: kernel
        run: cargo build --profile audit_small --target x86_64-unknown-none --locked --features "self_test,smp,net,ext4,iommu"
      # Build release + production kernel (for boot stress)
      - name: Build kernel (release, production)
        working-directory: kernel
        run: cargo build --release --target x86_64-unknown-none --locked
      - name: Build boot image (self_test)
        run: python3 builder/build_limine_image.py --kernel target/x86_64-unknown-none/release/vahi_kernel --initrd kernel/initrd.tar --output t00_selftest.bin
      - name: Build boot image (audit_small)
        run: python3 builder/build_limine_image.py --kernel target/x86_64-unknown-none/audit_small/vahi_kernel --initrd kernel/initrd.tar --output t00_audit.bin
      - name: Build boot image (production)
        run: python3 builder/build_limine_image.py --kernel target/x86_64-unknown-none/release/vahi_kernel --initrd kernel/initrd.tar --output t00_normal.bin
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-binaries-nightly
          path: |
            target/x86_64-unknown-none/release/vahi_kernel
            target/x86_64-unknown-none/audit_small/vahi_kernel
          if-no-files-found: error
          retention-days: 1
      - name: Upload boot images
        uses: actions/upload-artifact@v4
        with:
          name: boot-images-nightly
          path: |
            t00_selftest.bin
            t00_audit.bin
            t00_normal.bin
          if-no-files-found: error
          retention-days: 1

  selftest-smp2:
    name: QEMU Self-Test (SMP 2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-kernel-nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-toolchain
        id: install-toolchain
        with:
          target: x86_64-unknown-none
          components: rust-src,llvm-tools-preview,clippy,rustfmt
      - name: Download kernel artifacts
        uses: actions/download-artifact@v4
        with:
          name: kernel-binaries-nightly
          path: kernel/target/x86_64-unknown-none/release
      - name: Download boot images
        uses: actions/download-artifact@v4
        with:
          name: boot-images-nightly
          path: tests
      - uses: ./.github/actions/setup-qemu
      # SMP 2 showed a roughly 1-in-10 intermittent failure that was never
      # reproduced (issues.md "SMP scaling"); this run pins it.
      - name: Run T-00 suite (SMP 2)
        run: |
          python3 tests/run_qemu_tests.py \
            --image tests/t00_selftest.bin \
            --ovmf "$OVMF" \
            --expect-count auto \
            --smp 2 \
            --timeout 2400 \
            --qemu-extra "-vga none" \
            --serial tests/t00_smp2_serial.log \
            --log tests/t00_smp2.log
      - name: Upload serial + runner logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-smp2-logs
          path: |
            tests/t00_smp2.log
            tests/t00_smp2_serial.log
          if-no-files-found: ignore
          retention-days: 7

  selftest-audit:
    name: QEMU Self-Test (audit profile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-kernel-nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-toolchain
        id: install-toolchain
        with:
          target: x86_64-unknown-none
          components: rust-src,llvm-tools-preview,clippy,rustfmt
      - name: Download kernel artifacts
        uses: actions/download-artifact@v4
        with:
          name: kernel-binaries-nightly
          path: kernel/target/x86_64-unknown-none
      - name: Download boot images
        uses: actions/download-artifact@v4
        with:
          name: boot-images-nightly
          path: tests
      - uses: ./.github/actions/setup-qemu
      # audit_small keeps overflow-checks + debug-assertions on while staying
      # within the size the KASLR mapping can relocate (root Cargo.toml).
      - name: Run T-00 suite (audit_small)
        run: |
          python3 tests/run_qemu_tests.py \
            --image tests/t00_audit.bin \
            --ovmf "$OVMF" \
            --expect-count auto \
            --timeout 2400 \
            --qemu-extra "-vga none" \
            --serial tests/t00_audit_serial.log \
            --log tests/t00_audit.log
      - name: Upload serial + runner logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-audit-logs
          path: |
            tests/t00_audit.log
            tests/t00_audit_serial.log
          if-no-files-found: ignore
          retention-days: 7

  boot-stress:
    name: Boot Stress (25 boots)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [build-kernel-nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-toolchain
        id: install-toolchain
        with:
          target: x86_64-unknown-none
          components: rust-src,llvm-tools-preview,clippy,rustfmt
      - name: Download kernel artifacts
        uses: actions/download-artifact@v4
        with:
          name: kernel-binaries-nightly
          path: kernel/target/x86_64-unknown-none/release
      - name: Download boot images
        uses: actions/download-artifact@v4
        with:
          name: boot-images-nightly
          path: tests
      - uses: ./.github/actions/setup-qemu
      - name: 25 alternating boots (strict)
        run: |
          for i in $(seq 1 25); do
            if [ $((i % 2)) -eq 0 ]; then
              smp=2
              extra=(--expect-ap 1)
            else
              smp=1
              extra=()
            fi
            echo "=== boot $i/25 (smp $smp) ==="
            python3 tests/run_qemu_tests.py \
              --image tests/t00_normal.bin \
              --ovmf "$OVMF" \
            --boot-only --smp "$smp" "${extra[@]}" \
            --qemu-extra "-vga none" \
            --serial "tests/stress_${i}_serial.log" \
            --log "tests/stress_$i.log"
          done
      - name: Upload boot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-stress-logs
          path: tests/stress_*.log
          if-no-files-found: ignore
          retention-days: 7