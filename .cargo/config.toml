[build]

[target.x86_64-unknown-none]
rustflags = [
    "-C", "target-feature=-sse",
    "-C", "link-arg=-Tlinker.ld",
    # KASLR (issue A-6): with `static`, lld resolves every absolute address at
    # link time and leaves no runtime relocation to apply, so the mapping can be
    # randomised but no embedded pointer is ever corrected. `pic` instead emits
    # R_X86_64_RELATIVE entries into an alloc .rela.dyn that the kernel can walk
    # after the slide. This is the model Linux uses for KASLR.
    "-C", "relocation-model=pic",
]

[target.aarch64-unknown-none]
rustflags = [
    "-C", "target-feature=+soft-float,+strict-align",
    "-C", "link-arg=-Taarch64-linker.ld",
    "-C", "relocation-model=static",
]

[env]
SMOLTCP_IFACE_MAX_ADDR_COUNT = "4"
SMOLTCP_IFACE_MAX_ROUTE_COUNT = "4"
